name: Embedded player validation

on:
  pull_request:
    paths:
      - "src/screens/home/Player.tsx"
      - "src/components/media-console/EmbeddedStreamPlayer.tsx"
      - ".github/workflows/embedded-player-validation.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed player files
        run: npx eslint src/screens/home/Player.tsx src/components/media-console/EmbeddedStreamPlayer.tsx
